<div class="ui-box">
  <div class="ui-row">
    <label>Mode</label>
    <select id="mode">
      <option value="txt2img">txt2img</option>
      <option value="inpainting">inpainting</option>
    </select>
  </div>
  <div class="ui-row" style="position:relative;">
    <label>Tags</label>
    <input id="tags" placeholder="예: woman, cinematic, ..." autocomplete="off">
    <div id="ac" class="ac-list" style="display:none;"></div>
  </div>
  <div class="ui-row">
    <label>NSFW</label>
    <select id="nsfw"><option value="false">n</option><option value="true">y</option></select>
  </div>
  <div class="ui-row">
    <label>Sampler</label>
    <select id="sampler">
      <option>euler</option><option>heun</option><option>ddim</option><option>ddpm_plus</option>
    </select>
  </div>
  <div class="ui-row"><label>CFG</label><input id="cfg" value="4.0"></div>
  <div class="ui-row"><label>Steps</label><input id="steps" value="30"></div>
  <div class="ui-row"><label>Seed</label><input id="seed" value="-1"></div>

  <div id="txt2img-box">
    <div class="ui-row"><label>H</label><input id="H" value="1024"></div>
    <div class="ui-row"><label>W</label><input id="W" value="1024"></div>
  </div>

  <div id="inpaint-box" style="display:none;">
    <div class="ui-row"><label>Image Path</label><input id="img_path" placeholder="/path/to/image.png"></div>
    <div class="ui-row"><label>Start T</label><input id="start_t" value="0.9"></div>
    <div class="ui-row"><label>Brush</label><input id="brush" type="number" value="20"></div>
    <div class="ui-row"><label></label><button id="load_image" type="button">Load Image</button></div>

    <div id="mask-editor" style="display:none;">
      <div style="position:relative; width:100%; line-height:0;">
        <canvas id="bg-canvas" style="width:100%; height:auto;"></canvas>
        <canvas id="mask-canvas" style="position:absolute; left:0; top:0; width:100%; height:100%; cursor:crosshair; touch-action:none;"></canvas>
      </div>
      <div class="ui-btns">
        <button id="mask-clear" type="button">Clear Mask</button>
        <button id="mask-finish" type="button">Finish Mask</button>
      </div>
      <div id="mask-status">대기 중...</div>
    </div>
  </div>

  <div class="ui-btns">
    <button id="run">Generate</button>
    <button id="clear_out">Clear</button>
  </div>
  <div id="out"></div>
</div>
